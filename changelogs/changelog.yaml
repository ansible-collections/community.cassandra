ancestor: null
releases:
  1.0.4:
    changes:
      release_summary: Maintenance release
      bugfixes:
      - cassandra_cqlsh - Double quote cql shell command when it contains single quotes.
      - All modules - Ensure login parameters are available across all modules.
    release_date: '2021-02-27'
  1.0.5:
    changes:
      release_summary: Maintenance release
      bugfixes:
      - Remove cassandra_dba role.
      - Add missing metadata to existing roles.
    release_date: '2021-04-21'
  1.0.6:
    changes:
      release_summary: Maintenance release
      bugfixes:
      - Improve regex in cassandra_keyspace module - PR160.
      - Fix import error in cassandra_cqlsh after 311x upgrade - PR158.
      minor_changes:
      - Various minor module documentation improvements PR161.
      - Add additional_args parameter to cassandra_cqlsh module PR149.
    release_date: '2021-09-25'
  1.1.0:
    changes:
      release_summary: Adds new module cassandra_reload and provides a few minor fixes.
      minor_changes:
      - 183 - Adds new module cassandra_reload.
      - 182 - Add retries to network related tasks in all roles.
      - A bunch of other PRs addressed issues in the integration test code related to Cassandra 4.0.
    release_date: '2021-11-20'
  1.2.0:
    changes:
      release_summary: Adds many new modules and a minor bug fix.
      bugfixes:
      - 204 - Fix cassandra_role keyspace idempotency bug.
    release_date: '2022-02-12'
    modules:
    - name: cassandra_garbagecollect
      description: Removes deleted data from one or more tables.
      namespace: ''
    - name: cassandra_maxhintwindow
      description: Set the specified max hint window in ms.
      namespace: ''
    - name: cassandra_batchlogreplaythrottle
      description: Sets the batch log replay throttle.
      namespace: ''
    - name: cassandra_invalidatecache
      description: Invalidates the various caches on the Cassandra node.
      namespace: ''
    - name: cassandra_removenode
      description: Removes a node by the given host id from the cluster.
      namespace: ''
    - name: cassandra_decommission
      description: Deactivates a node by streaming its data to another node.
      namespace: ''
    - name: cassandra_assassinate
      description: Run the assassinate command against a node.
      namespace: ''
    - name: cassandra_concurrency
      description: Manage concurrency parameters on the Cassandra node.
      namespace: ''
    - name: cassandra_fullquerylog
      description: Manages the full query log feature.
      namespace: ''
    - name: cassandra_truncatehints
      description: Truncate all hints on the local node, or truncate hints for the endpoint(s) specified.
      namespace: ''
    - name: cassandra_timeout
      description: Manages the timeout on the Cassandra node.
      namespace: ''
    - name: cassandra_compact
      description: Manage compaction on the Cassandra node.
      namespace: ''
  1.2.2:
    changes:
      release_summary: Maintenance release
      bugfixes:
      - 214 - cassandra_fullquerylog - Fix typo in documentation.
      - 213 - cassandra_cqlsh - Missing handler for `--ssl` option for `cassandra_cqlsh`
    release_date: '2022-05-15'
  1.2.3:
    changes:
      release_summary: Maintenance release
      bugfixes:
      - 239 - cassandra_role - Adds quoting to role name to support special characters in the role name, i.e. my-app-role.
    release_date: '2023-03-11'
  1.2.4:
    changes:
      release_summary: Maintenance release
      bugfixes:
      - 244 cassandra_repository - Update APT Repository url.
    release_date: '2023-06-06'
  1.3.0:
    changes:
      release_summary: Maintenance release
      minor_changes:
      - 230 - Adds basic SSL/TLS support to the cassandra_keyspace, cassandra_role and cassandra_table modules.
    release_date: '2023-07-18'
  1.3.1:
    changes:
      release_summary: Maintenance release
      minor_changes:
      - 269 - cassandra_role - Allow for update of passwords.
      bugfixes:
      - 259 - cassandra_repository - Fix repo url.
      - 258 - cassandra_repository - Add static key.
    release_date: '2024-02-19'
  1.3.2:
    changes:
      release_summary: Maintenance release
      minor_changes:
      - 274 - cassandra_keyspace & cassandra_role - Ensure that data_centres parameter and aliases are consistent.
    release_date: '2024-03-10'
  1.3.3:
    changes:
      release_summary: Maintenance release. Version bumped to get the auto-release running.
    release_date: '2024-04-13'
  1.4.0:
    changes:
      release_summary: Maintenance release.
      minor_changes:
      - 287 - Adds the consistency_level parameter to the cassandra_role, cassandra_keyspace and cassandra_table modules.
    release_date: '2024-10-19'
  1.4.1:
    changes:
      release_summary: Maintenance release.
      minor_changes:
      - 306 - various roles - Use full module paths.
    release_date: '2026-01-11'
  1.5.0:
    changes:
      release_summary: New features in cassandra_status module.
      minor_changes:
      - cassandra_status - Adds resolve_ip and keyspace parameters and provides richer return data (#316).
    release_date: '2026-06-17'
  1.5.1:
    changes:
      release_summary: Maintenance release.
      minor_changes:
      - Update RETURN documentation block in the cassandra_status to describe return data correctly (#323).
    release_date: '2026-06-20'
  1.5.2:
    changes:
      release_summary: Adds two new modules.
    release_date: '2026-07-02'
    modules:
    - name: cassandra_statusbinary
      description: Returns the status of the binary protocol, also known as the native transport (#324).
      namespace: ''
    - name: cassandra_statusgossip
      description: Returns the status of gossip (#324).
      namespace: ''
  2.0.0:
    changes:
      release_summary: Cassandra 5.0 officially supported.
      minor_changes:
      - cassandra_verify - (#328) extended the existing 4.1 "verify disabled by default" test skip to 50x (same restriction applies).
      - cassandra_role - (#328) 5.0's Dynamic Data Masking adds 2 implicit permissions (UNMASK, SELECT_MASKED). Test now expects the right row count per version instead of a hardcoded one.
      bugfixes:
      - cassandra_repository - (#328) apt key handling modernized to signed-by keyring (the old apt_key approach fails GPG verification for the 50x repo).
      - cassandra_linux - (#328) fixed ansible.builtin.mount resolution, added missing ansible.posix dependency.
      - cassandra_streamthroughput / cassandra_interdcstreamthroughput - (#328) fixed a pre-existing bug (present since 4.1) where the -d flag never actually reached nodetool, causing both to fail on 4.1+/5.0.
      - cassandra_status - (#331,#332) various bugfixes and enhancements.
    release_date: '2026-09-10'
