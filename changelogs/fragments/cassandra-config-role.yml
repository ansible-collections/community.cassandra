minor_changes:
  - cassandra_config - new role writing Cassandra's configuration files for 4.0, 4.1 and 5.0 from variables (``cassandra.yaml``, ``cassandra-env.sh``, the JVM options files, ``cassandra-rackdc.properties``, ``logback.xml``), with the stock values as defaults; it backs up the files it replaces and creates the missing data and log directories, owned by the service account ``cassandra_user``:``cassandra_group`` (https://github.com/ansible-collections/community.cassandra/issues/334).
