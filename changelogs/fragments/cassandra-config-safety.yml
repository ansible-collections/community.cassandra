minor_changes:
  - cassandra_config - shows the diff of each file (secret values masked) and asks before changing a node that is already initialized (``cassandra_config_confirm``), refuses to change the identity of a joined node (cluster name, tokens, partitioner, snitch, datacenter, rack, 5.0 storage compatibility mode beyond one step; ``cassandra_config_force_identity_change``), refuses a ``cassandra_version`` of another series than the installed package, directories on an ``/etc/fstab`` mount point that is not mounted and a ``cassandra.yaml`` that is not valid YAML, says when the files of a running node changed, and on RedHat writes to its own conf dir selected with ``alternatives`` (``cassandra_rpm_conf_alternative``) (https://github.com/ansible-collections/community.cassandra/issues/334).
