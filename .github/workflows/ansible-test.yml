    if: needs.integration_matrix.outputs.matrix != '[]'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ansible_collections/community/cassandra
    strategy:
      matrix:
        versions:
          - python_version: "3.10"
            ansible_version: "stable-2.16"
          - python_version: "3.10"
            ansible_version: "stable-2.17"
          #- python_version: "3.12" ccm issues with six older python https://github.com/apache/cassandra-ccm/pull/800
          #  ansible_version: "stable-2.18"
          #- python_version: "3.12"
          #  ansible_version: "milestone"
        cassandra_version:
          - package_version: "41x"
            tar_version: "4.1.7"
        test_scenario:
          #- docker_image: centos7
