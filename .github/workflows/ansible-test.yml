name: CI
on:
  pull_request:
  workflow_dispatch:  # manual full run
  schedule:
    - cron: "0 3 * * *"

env:
  setup_cassandra_version_file: "./tests/integration/targets/setup_cassandra/defaults/main.yml"
  setup_ccm_version_file: "./tests/integration/targets/setup_cassandra_cluster_manager/defaults/main.yml"

# A new push to a pull request cancels its runs still going
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sanity:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ansible_collections/community/cassandra
    strategy:
      matrix:
        versions:
          - python_version: "3.10"
            ansible_version: "stable-2.16"
          - python_version: "3.11"
            ansible_version: "stable-2.17"
          - python_version: "3.12"
            ansible_version: "stable-2.18"
          #- python_version: "3.12"
          #  ansible_version: "devel"
    steps:

      - name: Check out code
        uses: actions/checkout@v6
        with:
          path: ansible_collections/community/cassandra

      - name: Set up Python ${{ matrix.versions.python_version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.versions.python_version }}

      - name: Install ansible-base (${{ matrix.versions.ansible_version }})
        uses: nick-invision/retry@v4
        with:
          timeout_minutes: 3
          max_attempts: 3
          command: pip install https://github.com/ansible/ansible/archive/${{ matrix.versions.ansible_version }}.tar.gz --disable-pip-version-check

      - name: Run sanity tests
        run: ansible-test sanity --docker -v --color --python ${{ matrix.versions.python_version }}

  units:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ansible_collections/community/cassandra
    strategy:
      matrix:
        versions:
          - python_version: "3.10"
            ansible_version: "stable-2.16"
          - python_version: "3.11"
            ansible_version: "stable-2.17"
          - python_version: "3.12"
            ansible_version: "stable-2.18"
    steps:

      - name: Check out code
        uses: actions/checkout@v6
        with:
          path: ansible_collections/community/cassandra

      - name: Set up Python ${{ matrix.versions.python_version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.versions.python_version }}

      - name: Install ansible-base (${{ matrix.versions.ansible_version }})
        uses: nick-invision/retry@v4
        with:
          timeout_minutes: 3
          max_attempts: 3
          command: pip install https://github.com/ansible/ansible/archive/${{ matrix.versions.ansible_version }}.tar.gz --disable-pip-version-check

      - name: Install coverage
        run: pip install coverage --disable-pip-version-check

      - name: Install unit test requirements
        run: pip install -r tests/unit/requirements.txt --disable-pip-version-check

      - name: Run unit tests
        run: ansible-test units -v --color --python ${{ matrix.versions.python_version }} --coverage

      - name: Generate coverage report.
        run: ansible-test coverage xml -v --requirements --group-by command --group-by version

      - uses: codecov/codecov-action@v7.0.0
        with:
          fail_ci_if_error: false

      - name: Upload Coverage data
        run: tests/coverage.sh

  integration_matrix:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ansible_collections/community/cassandra
    outputs:
      matrix: ${{ steps.json-list.outputs.modules-to-test }}

    steps:

      - name: Check out code
        uses: actions/checkout@v6
        with:
          path: ansible_collections/community/cassandra
          fetch-depth: 0

      # Pull requests test the targets of the modules they change; changes shared by
      # every module (module_utils, test setup, this workflow...), scheduled and manual runs test all
      - name: Generate module list
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          all=$(find tests/integration/targets -mindepth 1 -maxdepth 1 -type d -not -name 'setup*' | cut -d '/' -f4 | sort)
          targets="$all"
          if [ -n "$BASE_SHA" ]; then
            changed=$(git diff --name-only "$BASE_SHA" HEAD)
            if ! echo "$changed" | grep -qE '^(plugins/module_utils/|plugins/doc_fragments/|tests/integration/targets/setup_|tests/coverage\.sh|meta/runtime\.yml|\.github/workflows/ansible-test\.yml|galaxy\.yml)'; then
              modules=$(echo "$changed" | sed -nE 's#^plugins/modules/([^/]+)\.py$#\1#p')
              # the targets of the changed modules and of their tests, and the targets that use them
              targets=$( { echo "$modules"; echo "$changed" | sed -nE 's#^tests/integration/targets/([^/]+)/.*#\1#p'
                for m in $modules; do grep -rlE "^[[:space:]-]*(community\.cassandra\.)?$m:[[:space:]]*$" tests/integration/targets | cut -d/ -f4; done
              } | sort -u | grep -Fx -f <(echo "$all") || true)
            fi
          fi
          echo "$targets" | awk NF | jq -sRc 'split("\n") | map(select(length > 0))' > int_test_modules.json

      - name: Set output variable
        id: json-list
        run: |
          output=$(cat int_test_modules.json)
          echo "modules-to-test=$output" >> $GITHUB_OUTPUT
          echo "$output"

  integration_40x:
    needs: integration_matrix
    if: needs.integration_matrix.outputs.matrix != '[]'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ansible_collections/community/cassandra
    strategy:
      matrix:
        versions:
          - python_version: "3.10"
            ansible_version: "stable-2.16"
          - python_version: "3.10"
            ansible_version: "stable-2.17"
          #- python_version: "3.12"
          #  ansible_version: "stable-2.18"
          #- python_version: "3.12"
          #  ansible_version: "milestone"
        cassandra_version:
          - package_version: "40x"
            tar_version: "4.0.9"
        test_scenario:
          #- docker_image: centos7
          #  python_version: "2.7"
          #  ansible_test_options: "--docker-privileged"
          - docker_image: "default"
            python_version: "3.10" # ccm issues with six
            ansible_test_options: ""
        cassandra_module: ${{ fromJson(needs.integration_matrix.outputs.matrix) }}
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          path: ansible_collections/community/cassandra

      - name: Set up Python ${{ matrix.versions.python_version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.versions.python_version }}

      - name: Install ansible-base (${{ matrix.versions.ansible_version }})
        uses: nick-invision/retry@v4
        with:
          timeout_minutes: 3
          max_attempts: 3
          command: pip install https://github.com/ansible/ansible/archive/${{ matrix.versions.ansible_version }}.tar.gz --disable-pip-version-check

      # Galaxy has short outages: fall back to the release on GitHub, and retry both for a few minutes
      - name: Install ansible.posix
        uses: nick-invision/retry@v4
        with:
          timeout_minutes: 3
          max_attempts: 5
          retry_wait_seconds: 60
          command: >-
            ansible-galaxy collection install ansible.posix -p ansible_collections/
            || ansible-galaxy collection install --no-deps git+https://github.com/ansible-collections/ansible.posix.git,2.2.2 -p ansible_collections/

      - name: Ensure cassandra versions are set to ${{ matrix.cassandra_version.package_version }} | ${{ matrix.cassandra_version.tar_version }}
        run: |
          sed -i 's/^cassandra_version:.*/cassandra_version: \"${{ matrix.cassandra_version.package_version }}\"/g' ${{ env.setup_cassandra_version_file }}
          sed -i 's/^cassandra_version:.*/cassandra_version: \"${{ matrix.cassandra_version.tar_version }}\"/g' ${{ env.setup_ccm_version_file }}

      - name: Run integration tests on Python ${{ matrix.test_scenario.python_version }} | ${{ matrix.test_scenario.docker_image }} | ${{ matrix.versions.ansible_version }} | ${{ matrix.cassandra_module }} | ${{ matrix.cassandra_version.package_version }}
        run: ansible-test integration --docker ${{ matrix.test_scenario.docker_image }} ${{ matrix.test_scenario.ansible_test_options }} -v --color --retry-on-error --python ${{ matrix.test_scenario.python_version }} --continue-on-error --diff --coverage  ${{ matrix.cassandra_module }}

      - name: Generate coverage report.
        run: ansible-test coverage xml -v --requirements --group-by command --group-by version

      - uses: codecov/codecov-action@v7.0.0
        with:
          fail_ci_if_error: false

      - name: Upload Coverage data
        run: tests/coverage.sh

