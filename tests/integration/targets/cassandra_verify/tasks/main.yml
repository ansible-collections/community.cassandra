---

- name: "Run old verify tests"
  ansible.builtin.import_tasks: old_verify.yml
  when: cassandra_version == "40x"

- name: "Run tests for versions where verify is disabled by default (CASSANDRA-9947/17017)"
  ansible.builtin.import_tasks: 4_1_verify_disabled.yml
  when: cassandra_version in ["41x", "50x"]
