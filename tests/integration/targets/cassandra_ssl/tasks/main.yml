---
# ansible-test retries a failed target on the same host: whatever happens,
# leave no ccm node running, or the retry finds its ports in use
- name: SSL tests
  block:
    - name: Run the tests
      ansible.builtin.include_tasks: tests.yml
  always:
    - name: Remove the ccm clusters
      ansible.builtin.shell: "sudo -E -u cassandra bash -c \"{{ ccm_cmd }} remove {{ item }} > /dev/null\""
      become_user: cassandra
      args:
        chdir: /home/cassandra
      environment:
        CCM_CONFIG_DIR: "/home/cassandra/config"
        CASSANDRA_HOME: "/home/cassandra"
        PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      loop: [ssl-test-cluster, ssl-test-cluster-auth]
      failed_when: false

    - name: Wait until the nodes' storage ports are free
      ansible.builtin.wait_for:
        host: "{{ item.ip }}"
        port: 7000
        state: stopped
        timeout: 120
      with_items: "{{ cassandra_nodes }}"
      failed_when: false
