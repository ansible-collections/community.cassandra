---
# Starts the ccm cluster ccm_cluster. A node that dies at startup (seen on CI
# runners) gets its log shown, then the cluster is stopped and started once more.
- name: Start the ccm cluster {{ ccm_cluster }}
  vars:
    _ccm_env: &ccm_env
      CCM_CONFIG_DIR: "/home/cassandra/config"
      CASSANDRA_HOME: "/home/cassandra"
      JAVA_TOOL_OPTIONS: "-Dcom.sun.jndi.rmiURLParsing=legacy"
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      CCM_CLUSTER_START_DEFAULT_TIMEOUT: 600
      JAVA_HOME: "{{ (ansible_os_family == 'RedHat') | ternary('/usr/lib/jvm/java-' ~ j_version ~ '-openjdk', '/usr/lib/jvm/java-' ~ j_version ~ '-openjdk-amd64') }}"
  block:
    - name: Start the ccm cluster
      ansible.builtin.shell: sudo -E -u cassandra bash -c "{{ ccm_cmd }} start {{ ccm_cluster }} --root"
      become_user: cassandra
      args:
        chdir: /home/cassandra
      environment: *ccm_env
  rescue:
    - name: Show the end of each node's log
      ansible.builtin.shell: "tail -n 40 /home/cassandra/config/{{ ccm_cluster }}/{{ item.node }}/logs/system.log"
      with_items: "{{ cassandra_nodes }}"
      failed_when: false

    - name: Show the memory left
      ansible.builtin.command: free -m
      failed_when: false

    - name: Stop what started
      ansible.builtin.shell: sudo -E -u cassandra bash -c "{{ ccm_cmd }} stop {{ ccm_cluster }}"
      become_user: cassandra
      args:
        chdir: /home/cassandra
      environment: *ccm_env
      failed_when: false

    - name: Wait until the nodes' storage ports are free
      ansible.builtin.wait_for:
        host: "{{ item.ip }}"
        port: 7000
        state: stopped
        timeout: 120
      with_items: "{{ cassandra_nodes }}"

    - name: Start the ccm cluster again
      ansible.builtin.shell: sudo -E -u cassandra bash -c "{{ ccm_cmd }} start {{ ccm_cluster }} --root"
      become_user: cassandra
      args:
        chdir: /home/cassandra
      environment: *ccm_env
