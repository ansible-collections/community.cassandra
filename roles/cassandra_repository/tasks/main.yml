---
# tasks file for cassandra_repository
- name: Ensure Cassandra yum repository exists (RedHat)
  ansible.builtin.yum_repository:
      name: "cassandra-{{ cassandra_version }}"
      description: "Official Cassandra {{ cassandra_version }} yum repo"
      baseurl: "https://redhat.cassandra.apache.org/{{ cassandra_version }}/"
      gpgcheck: 1
      gpgkey: "https://downloads.apache.org/cassandra/KEYS"
  retries: 3
  when: ansible_facts['os_family'] == "RedHat"


- name: Install debian packages (Debian & Ubuntu)
  ansible.builtin.apt:
    name: "{{ debian_packages }}"
    state: present
  retries: 3
  when: ansible_facts['os_family'] == "Debian"

- set_fact:
    validate_certs: true
  when:
    - "ansible_facts['distribution'] == 'Ubuntu'"
    - "ansible_facts['distribution_version'] == '16.04'"


- name: Ensure /etc/apt/keyrings exists (Debian & Ubuntu)
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  when: ansible_facts['os_family'] == "Debian"

- name: Fetch Cassandra apt signing key (Debian & Ubuntu)
  ansible.builtin.get_url:
    url: https://downloads.apache.org/cassandra/KEYS
    dest: "{{ cassandra_apt_keyring_path }}"
    mode: "0644"
  retries: 3
  when: ansible_facts['os_family'] == "Debian"

- name: Ensure Cassandra apt repository exists (Debian & Ubuntu)
  ansible.builtin.apt_repository:
    repo: "deb [signed-by={{ cassandra_apt_keyring_path }}] https://debian.cassandra.apache.org {{ cassandra_version }} main"
    state: present
    filename: "cassandra-{{ cassandra_version }}"
  retries: 3
  when: ansible_facts['os_family'] == "Debian"
