        description:
        - C(commitlog_sync_group_window_in_ms) in C(cassandra.yaml) (4.0 only), written when
          O(cassandra_commitlog_sync=group), which needs it (no default). Milliseconds above zero (4.0 reads a
          float), e.g. V(15). See O(cassandra_commitlog_sync_group_window).
      cassandra_commitlog_segment_size_in_mb:
        type: int
        default: 32
        description:
        - C(commitlog_segment_size_in_mb) in C(cassandra.yaml) (4.0 only).
      cassandra_index_summary_resize_interval_in_minutes:
        type: int
        default: 60
        description:
        - C(index_summary_resize_interval_in_minutes) in C(cassandra.yaml) (4.0 only).
      cassandra_trickle_fsync_interval_in_kb:
        type: int
        default: 10240
        description:
