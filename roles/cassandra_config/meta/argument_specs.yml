      cassandra_write_request_timeout_in_ms:
        type: int
        default: 2000
        description:
        - C(write_request_timeout_in_ms) in C(cassandra.yaml) (4.0 only).
      cassandra_counter_write_request_timeout_in_ms:
        type: int
        default: 5000
        description:
        - C(counter_write_request_timeout_in_ms) in C(cassandra.yaml) (4.0 only).
      cassandra_cas_contention_timeout_in_ms:
        type: int
        default: 1000
        description:
        - C(cas_contention_timeout_in_ms) in C(cassandra.yaml) (4.0 only).
      cassandra_truncate_request_timeout_in_ms:
        type: int
        default: 60000
        description:
        - C(truncate_request_timeout_in_ms) in C(cassandra.yaml) (4.0 only).
      cassandra_request_timeout_in_ms:
        type: int
        default: 10000
