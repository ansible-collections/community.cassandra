        - C(request_timeout_in_ms) in C(cassandra.yaml) (4.0 only).
      cassandra_slow_query_log_timeout_in_ms:
        type: int
        default: 500
        description:
        - C(slow_query_log_timeout_in_ms) in C(cassandra.yaml) (4.0 only).
      cassandra_dynamic_snitch_update_interval_in_ms:
        type: int
        default: 100
        description:
        - C(dynamic_snitch_update_interval_in_ms) in C(cassandra.yaml) (4.0 only).
      cassandra_dynamic_snitch_reset_interval_in_ms:
        type: int
        default: 600000
        description:
        - C(dynamic_snitch_reset_interval_in_ms) in C(cassandra.yaml) (4.0 only).
      cassandra_enable_legacy_ssl_storage_port:
        type: bool
        default: false
        description:
        - C(enable_legacy_ssl_storage_port) in C(cassandra.yaml) (4.0 only).
      cassandra_tracetype_query_ttl:
        type: int
        default: 86400
        description:
        - C(tracetype_query_ttl) in C(cassandra.yaml) (4.0 only).
      cassandra_tracetype_repair_ttl:
        type: int
        default: 604800
        description:
        - C(tracetype_repair_ttl) in C(cassandra.yaml) (4.0 only).
      cassandra_enable_user_defined_functions:
        type: bool
        default: false
        description:
        - C(enable_user_defined_functions) in C(cassandra.yaml) (4.0 only).
      cassandra_enable_scripted_user_defined_functions:
        type: bool
        default: false
        description:
        - C(enable_scripted_user_defined_functions) in C(cassandra.yaml) (4.0 only).
      cassandra_windows_timer_interval:
        type: int
        default: 1
        description:
        - C(windows_timer_interval) in C(cassandra.yaml) (4.0 only).
      cassandra_batch_size_warn_threshold_in_kb:
        type: int
        default: 5
        description:
        - C(batch_size_warn_threshold_in_kb) in C(cassandra.yaml) (4.0 only).
      cassandra_batch_size_fail_threshold_in_kb:
        type: int
        default: 50
        description:
        - C(batch_size_fail_threshold_in_kb) in C(cassandra.yaml) (4.0 only).
      cassandra_compaction_large_partition_warning_threshold_mb:
        type: int
        default: 100
        description:
        - C(compaction_large_partition_warning_threshold_mb) in C(cassandra.yaml) (4.0 only).
      cassandra_enable_materialized_views:
        type: bool
        default: false
        description:
        - C(enable_materialized_views) in C(cassandra.yaml) (4.0 only).
      cassandra_enable_sasi_indexes:
        type: bool
        default: false
        description:
        - C(enable_sasi_indexes) in C(cassandra.yaml) (4.0 only).
      cassandra_enable_transient_replication:
        type: bool
        default: false
        description:
        - C(enable_transient_replication) in C(cassandra.yaml) (4.0 only).
      cassandra_enable_drop_compact_storage:
        type: bool
        default: false
        description:
        - C(enable_drop_compact_storage) in C(cassandra.yaml) (4.0 only).
      cassandra_log_dir:
        type: path
        default: /var/log/cassandra
        description:
        - C(CASSANDRA_LOG_DIR) in C(cassandra-env.sh). Defaults to the value the deb and rpm packages use.
      cassandra_heap_size:
        type: str
        default: ''
        description:
        - 'C(MAX_HEAP_SIZE) in C(cassandra-env.sh), for example C(8G). Empty: the stock automatic sizing.'
        - Without G1 (CMS is the 4.x default), set O(cassandra_heap_newsize) as well on 4.x; on 5.0 it can only be set with
          G1 (its C(cassandra-env.sh) has no C(HEAP_NEWSIZE)). The role refuses other combinations.
      cassandra_heap_newsize:
        type: str
        default: ''
        description:
        - C(HEAP_NEWSIZE) in C(cassandra-env.sh) (4.x). Without G1, it must be set together with O(cassandra_heap_size).
      cassandra_max_direct_memory_size:
        type: str
        default: ''
        description:
        - 'C(MAX_DIRECT_MEMORY_SIZE) in C(cassandra-env.sh) (5.0). Empty: stock default.'
      cassandra_heap_dump_dir:
        type: path
        default: $CASSANDRA_LOG_DIR
        description:
        - C(CASSANDRA_HEAPDUMP_DIR) in C(cassandra-env.sh) (5.0).
      cassandra_local_jmx:
        type: bool
        default: true
        description:
        - JMX only on localhost (C(LOCAL_JMX=yes)). V(false) enables remote JMX, with authentication.
      cassandra_jmx_port:
        type: int
        default: 7199
        description:
        - C(JMX_PORT) in C(cassandra-env.sh).
      cassandra_jmx_rmi_hostname:
        type: str
        default: ''
        description:
        - C(java.rmi.server.hostname) for remote JMX. Left commented out when empty.
      cassandra_jvm_gc:
        type: str
        choices:
        - G1
        - CMS
        - custom
        description:
        - 'Garbage collector: V(G1), V(CMS) or V(custom). Defaults to the series'' stock GC (CMS on 4.x, G1 on 5.0).'
        - V(CMS) needs Java 8 or 11. V(custom) comments out both GC blocks; set your own flags with the C(cassandra_jvm<N>_extra_options)
          variables.
        - C(cassandra_jvm<N>_gc), for example C(cassandra_jvm11_gc), overrides it for one file.
      cassandra_jvm_cms_initiating_occupancy_fraction:
        type: int
        default: 75
        description:
        - C(-XX:CMSInitiatingOccupancyFraction) with CMS.
      cassandra_jvm_max_tenuring_threshold:
        type: int
        default: 2
        description:
        - C(-XX:MaxTenuringThreshold) with G1.
      cassandra_jvm_g1_heap_region_size:
        type: str
        default: 16m
        description:
        - C(-XX:G1HeapRegionSize) with G1.
      cassandra_jvm_g1_new_size_percent:
        type: int
        default: 50
        description:
        - C(-XX:G1NewSizePercent) with G1.
      cassandra_jvm_max_gc_pause_millis:
        type: int
        default: 300
        description:
        - C(-XX:MaxGCPauseMillis) with G1.
      cassandra_jvm_initiating_heap_occupancy_percent:
        type: int
        default: 70
        description:
        - C(-XX:InitiatingHeapOccupancyPercent) with G1.
      cassandra_jvm_parallel_gc_threads:
        type: raw
        default: ''
        description:
        - 'C(-XX:ParallelGCThreads). Empty: JVM default.'
      cassandra_jvm_conc_gc_threads:
        type: raw
        default: ''
        description:
        - 'C(-XX:ConcGCThreads). Empty: JVM default.'
      cassandra_extra_settings:
        type: dict
        default: {}
        description:
        - 'Settings no variable covers, written as-is at the end of C(cassandra.yaml), e.g. C({commitlog_total_space: 8192MiB}).'
        - Keys the template already has are refused (set them with their variable). Cassandra refuses unknown keys at startup.
      cassandra_jvm_extra_options:
        type: list
        elements: str
        default: []
        description:
        - Extra lines appended to C(jvm-server.options) (all Java versions).
      cassandra_jvm8_extra_options:
        type: list
        elements: str
        default: []
        description:
        - Extra lines appended to C(jvm8-server.options) (4.x).
      cassandra_jvm11_extra_options:
        type: list
        elements: str
        default: []
        description:
        - Extra lines appended to C(jvm11-server.options).
      cassandra_jvm17_extra_options:
        type: list
        elements: str
        default: []
        description:
        - Extra lines appended to C(jvm17-server.options) (5.0).
      cassandra_dc:
        type: str
        default: dc1
        description:
        - Datacenter in C(cassandra-rackdc.properties), usually set per datacenter group.
      cassandra_rack:
        type: str
        default: rack1
        description:
        - Rack in C(cassandra-rackdc.properties), usually set per node.
      cassandra_prefer_local:
        type: bool
        default: false
        description:
        - C(prefer_local) in C(cassandra-rackdc.properties).
      cassandra_log_level:
        type: str
        default: INFO
        description:
        - Root log level in C(logback.xml).
      cassandra_log_level_cassandra:
        type: str
        default: DEBUG
        description:
        - Level of the C(org.apache.cassandra) logger in C(logback.xml), which feeds C(debug.log).
      cassandra_debug_log_enabled:
        type: bool
        default: true
        description:
        - Write C(debug.log).
      cassandra_log_console:
        type: bool
        default: false
        description:
        - Also send the logs to stdout (the C(STDOUT) appender of C(logback.xml)).
          Under systemd that is a second copy of C(system.log) in journald; JVM
          errors before logback starts go to stdout either way.
      cassandra_config_owner:
        type: str
        default: root
        description:
        - Owner of the config files; it must exist. With the default, the service reads them but cannot rewrite them.
      cassandra_config_group:
        type: str
        description:
        - Group of the config files (Cassandra reads them through it); it must exist. Defaults to O(cassandra_group).
      cassandra_config_mode:
        type: str
        default: "0640"
        description:
        - Mode of the config files. C(cassandra.yaml) may hold keystore passwords.
      cassandra_config_force_identity_change:
        type: bool
        default: false
        description:
        - Change C(cluster_name), C(num_tokens), C(initial_token), C(partitioner),
          C(endpoint_snitch), C(dc), C(rack), C(dc_suffix) or C(ec2_naming_scheme) of a node that already joined a
          cluster, or move C(storage_compatibility_mode) by more than one step. Refused otherwise; only for a
          documented procedure (e.g. a snitch migration).
      cassandra_jmx_users:
        type: list
        elements: dict
        default: []
        description:
        - Remote JMX users (with O(cassandra_local_jmx) false), written to
          C(/etc/cassandra/jmxremote.password) and C(jmxremote.access), readable
          by O(cassandra_user) only. Each item has C(name), C(password) and C(access)
          (C(readwrite), the default, or C(readonly)). A C(readwrite) user also gets the C(create) and
          C(unregister) rights of the JDK's controlRole, unless C(create_unregister) is false. Keep the passwords
          in a vault.
      cassandra_config_backup:
        type: bool
        default: true
        description:
        - Keep a timestamped copy of each file the role replaces, next to it.
      cassandra_data_file_directories:
        type: list
        elements: path
        description:
        - C(data_file_directories) in C(cassandra.yaml), one per disk (JBOD).
          Defaults to O(cassandra_data_dir) alone. The system keyspaces live in the first one.
