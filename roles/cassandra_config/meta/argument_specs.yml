      cassandra_column_index_cache_size_in_kb:
        type: int
        default: 2
        description:
        - C(column_index_cache_size_in_kb) in C(cassandra.yaml) (4.0 only).
      cassandra_compaction_throughput_mb_per_sec:
        type: int
        default: 64
